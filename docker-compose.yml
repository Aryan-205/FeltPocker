# Local development: Postgres, Redis and the game server.
#   docker compose up -d db redis     # just the databases (then `pnpm dev`)
#   docker compose up --build         # everything, server on :4000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: felt
      POSTGRES_PASSWORD: felt
      POSTGRES_DB: felt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felt"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://felt:felt@db:5432/felt
      REDIS_URL: redis://redis:6379
      WEB_ORIGINS: http://localhost:3000
      PUBLIC_URL: http://localhost:4000
      DEV_LOGIN: "1"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
